<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A66FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="6" result="o" />
      <feComponentTransfer><feFuncA type="linear" slope="0.3" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="#0B1026" rx="20" />
  <rect width="1200" height="320" fill="none" stroke="rgba(10,102,255,0.15)" stroke-width="2" rx="20" />

  <text x="600" y="70" font-family="Segoe UI, system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle">Feature Highlights</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <!-- Card 1 -->
    <g transform="translate(80, 110)">
      <rect width="260" height="160" rx="16" fill="#141931" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <circle cx="40" cy="44" r="30" fill="url(#g)" filter="url(#s)" />
      <text x="40" y="52" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">🔐</text>
      <text x="40" y="100" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Login & Sessions</text>
      <text x="40" y="130" font-size="13" fill="#9AA5C1" text-anchor="middle">Credentials, cookies or AppState</text>
      <text x="40" y="154" font-size="13" fill="#9AA5C1" text-anchor="middle">persistent across restarts</text>
    </g>
    <!-- Card 2 -->
    <g transform="translate(370, 110)">
      <rect width="260" height="160" rx="16" fill="#141931" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <circle cx="40" cy="44" r="30" fill="url(#g)" filter="url(#s)" />
      <text x="40" y="52" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">⚡</text>
      <text x="40" y="100" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Realtime Events</text>
      <text x="40" y="130" font-size="13" fill="#9AA5C1" text-anchor="middle">Polling, MQTT &amp; realtime</text>
      <text x="40" y="154" font-size="13" fill="#9AA5C1" text-anchor="middle">DMs, threads, stories</text>
    </g>
    <!-- Card 3 -->
    <g transform="translate(660, 110)">
      <rect width="260" height="160" rx="16" fill="#141931" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <circle cx="40" cy="44" r="30" fill="url(#g)" filter="url(#s)" />
      <text x="40" y="52" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">📸</text>
      <text x="40" y="100" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Media &amp; Stories</text>
      <text x="40" y="130" font-size="13" fill="#9AA5C1" text-anchor="middle">Photo, video, reel,</text>
      <text x="40" y="154" font-size="13" fill="#9AA5C1" text-anchor="middle">IGTV &amp; story uploads</text>
    </g>
    <!-- Card 4 -->
    <g transform="translate(950, 110)">
      <rect width="260" height="160" rx="16" fill="#141931" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <circle cx="40" cy="44" r="30" fill="url(#g)" filter="url(#s)" />
      <text x="40" y="52" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">🧩</text>
      <text x="40" y="100" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Pure JavaScript</text>
      <text x="40" y="130" font-size="13" fill="#9AA5C1" text-anchor="middle">No native build step,</text>
      <text x="40" y="154" font-size="13" fill="#9AA5C1" text-anchor="middle">no compiled binaries</text>
    </g>
  </g>
</svg>
